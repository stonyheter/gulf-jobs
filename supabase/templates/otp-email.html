<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رمز الدخول</title>
</head>
<body style="margin:0;padding:0;background:#f8fafc;font-family:Arial,sans-serif;direction:rtl">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#f8fafc;padding:40px 20px">
    <tr><td align="center">
      <table width="560" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,0.08)">
        <!-- Header -->
        <tr>
          <td style="background:linear-gradient(135deg,#065f46,#059669);padding:32px;text-align:center">
            <div style="font-size:28px;font-weight:800;color:#ffffff;letter-spacing:-0.5px">🎯 وظائف الخليج</div>
            <div style="color:#a7f3d0;font-size:14px;margin-top:6px">Gulf Jobs Platform</div>
          </td>
        </tr>
        <!-- Body -->
        <tr>
          <td style="padding:40px 32px;text-align:center">
            <h2 style="color:#1e293b;font-size:22px;margin:0 0 8px">مرحباً بك! 👋</h2>
            <p style="color:#64748b;font-size:15px;margin:0 0 32px">رمز الدخول الخاص بك:</p>
            <!-- OTP Box -->
            <div style="background:#f0fdf4;border:2px solid #bbf7d0;border-radius:16px;padding:32px;margin:0 auto 32px;max-width:320px">
              <div style="font-size:48px;font-weight:900;letter-spacing:14px;color:#065f46;font-family:monospace;line-height:1">{{ .Token }}</div>
            </div>
            <p style="color:#94a3b8;font-size:13px;margin:0 0 4px">⏱️ صالح لمدة ساعة واحدة</p>
            <p style="color:#94a3b8;font-size:12px;margin:0">لم تطلب هذا الرمز؟ تجاهل هذا البريد</p>
          </td>
        </tr>
        <!-- Footer -->
        <tr>
          <td style="background:#f8fafc;padding:20px 32px;text-align:center;border-top:1px solid #e2e8f0">
            <p style="color:#94a3b8;font-size:12px;margin:0">© 2026 وظائف الخليج · Gulf Jobs</p>
          </td>
        </tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
