
[functions.import-jobs]
enabled = true
verify_jwt = false
import_map = "./functions/import-jobs/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/import-jobs/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/import-jobs/*.html" ]

[auth]
additional_redirect_urls = ["http://localhost:3456/**", "https://gulf-jobs.com/**"]
site_url = "http://localhost:3456"

[auth.email]
enable_confirmations = true
max_frequency = "1m0s"
otp_length = 6


[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
redirect_uri = "https://ufccobhceszsyvcigtpp.supabase.co/auth/v1/callback"

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[db.pooler]
default_pool_size = 15
max_client_conn = 200

[storage.analytics]
enabled = true
max_namespaces = 10

[storage.image_transformation]
enabled = true
